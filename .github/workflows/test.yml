# Three legs: frontend (Vitest under jsdom), backend (pytest + pytest-django
# against the in-memory SQLite test DB) and end-to-end (Playwright driving the
# real app against a real Django server). Runs on every push + PR so
# regressions land before review.
name: tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:run
      - name: Build (smoke)
        run: npm run build

  backend:
    name: Backend (pytest-django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt
      - name: Migrations are complete
        # A model change without its migration passes every test (the test DB
        # is built from the models) and then breaks the real database.
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate (sanity)
        run: python manage.py migrate --noinput
      - name: Test
        run: pytest -q

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Database
        working-directory: backend
        run: python manage.py migrate --noinput
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run
        # playwright.config.js starts the Django server and Vite itself.
        working-directory: frontend
        run: npm run e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
